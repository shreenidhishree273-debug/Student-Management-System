
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
            padding: 20px;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px #00000010;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #1e40af;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .clear-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            margin: 3px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            margin: 3px;
        }

        button:hover {
            opacity: 0.85;
        }

        .search-box {
            margin-bottom: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1e40af;
        }

        tr:hover {
            background: #f8fafc;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 16px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Student Management System</h1>
        <p>Manage student records easily</p>
    </header>

    <!-- Dashboard -->
    <section class="stats">

        <div class="stat-card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="stat-card">
            <h3>Departments</h3>
            <p id="totalDepartments">0</p>
        </div>

        <div class="stat-card">
            <h3>Male Students</h3>
            <p id="maleStudents">0</p>
        </div>

        <div class="stat-card">
            <h3>Female Students</h3>
            <p id="femaleStudents">0</p>
        </div>

    </section>

    <!-- Add Student Form -->
    <section class="card">

        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="rollNo">Roll Number</label>
                    <input type="text" id="rollNo"
                           placeholder="Enter roll number" required>
                </div>

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name"
                           placeholder="Enter student name"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="Enter phone number"
                           pattern="[0-9]{10}"
                           title="Enter a 10-digit phone number"
                           required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="CSE">CSE</option>
                        <option value="CSE-AIML">CSE-AIML</option>
                        <option value="IT">IT</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="MECH">MECH</option>
                        <option value="CIVIL">CIVIL</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

            </div>

            <div class="buttons">

                <button type="submit" class="add-btn"
                        id="submitBtn">
                    Add Student
                </button>

                <button type="button" class="clear-btn"
                        onclick="resetForm()">
                    Clear Form
                </button>

            </div>

        </form>

    </section>

    <!-- Student Records -->
    <section class="card">

        <h2>Student Records</h2>

        <div class="search-box">
            <input type="text" id="searchInput"
                   placeholder="Search by name, roll number, department..."
                   oninput="displayStudents()">
        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">

                    <tr>
                        <td colspan="8" class="empty">
                            No students added yet.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <footer>
        <p>Student Management System | Mini Project</p>
    </footer>

</div>

<script>

    // Load saved student records
    let students = [];

    try {
        const savedData = localStorage.getItem("students");

        students = savedData ? JSON.parse(savedData) : [];

        if (!Array.isArray(students)) {
            students = [];
        }
    } catch (error) {
        students = [];
    }

    let editIndex = -1;

    const form = document.getElementById("studentForm");

    // Save records in browser storage
    function saveStudents() {
        try {
            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );
            return true;
        } catch (error) {
            alert("Unable to save data in browser storage.");
            return false;
        }
    }

    // Add or update student
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const student = {
            rollNo: document.getElementById("rollNo").value.trim(),
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            department: document.getElementById("department").value,
            year: document.getElementById("year").value,
            gender: document.getElementById("gender").value
        };

        if (Object.values(student).some(value => !value)) {
            alert("Please fill in all fields.");
            return;
        }

        // Prevent duplicate roll numbers
        const duplicate = students.some((s, index) =>
            s.rollNo.toLowerCase() === student.rollNo.toLowerCase()
            && index !== editIndex
        );

        if (duplicate) {
            alert("This roll number already exists!");
            return;
        }

        if (editIndex === -1) {

            students.push(student);
            alert("Student added successfully!");

        } else {

            students[editIndex] = student;
            alert("Student updated successfully!");

        }

        if (saveStudents()) {
            resetForm();
            displayStudents();
        }

    });

    // Display student records
    function displayStudents() {

        const table = document.getElementById("studentTable");

        const search = document.getElementById("searchInput")
            .value.trim().toLowerCase();

        const filteredStudents = students
            .map((student, index) => ({ student, index }))
            .filter(({ student }) =>
                Object.values(student).some(value =>
                    String(value).toLowerCase().includes(search)
                )
            );

        table.innerHTML = "";

        if (filteredStudents.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="empty">
                        No matching student records found.
                    </td>
                </tr>
            `;

        } else {

            filteredStudents.forEach(({ student, index }) => {

                const row = document.createElement("tr");

                [
                    student.rollNo,
                    student.name,
                    student.email,
                    student.phone,
                    student.department,
                    student.year,
                    student.gender
                ].forEach(value => {

                    const cell = document.createElement("td");

                    // Prevent student input from being treated as HTML
                    cell.textContent = value;

                    row.appendChild(cell);

                });

                const actions = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit-btn";
                editButton.onclick = () => editStudent(index);

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";
                deleteButton.onclick = () => deleteStudent(index);

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                row.appendChild(actions);

                table.appendChild(row);

            });

        }

        updateDashboard();

    }

    // Edit student details
    function editStudent(index) {

        const student = students[index];

        document.getElementById("rollNo").value = student.rollNo;
        document.getElementById("name").value = student.name;
        document.getElementById("email").value = student.email;
        document.getElementById("phone").value = student.phone;
        document.getElementById("department").value = student.department;
        document.getElementById("year").value = student.year;
        document.getElementById("gender").value = student.gender;

        editIndex = index;

        document.getElementById("formTitle").textContent =
            "Edit Student Details";

        document.getElementById("submitBtn").textContent =
            "Update Student";

        document.getElementById("studentForm").scrollIntoView({
            behavior: "smooth"
        });

    }

    // Delete student record
    function deleteStudent(index) {

        const confirmed = confirm(
            "Are you sure you want to delete this student?"
        );

        if (confirmed) {

            const deletedStudent = students.splice(index, 1);

            if (saveStudents()) {
                displayStudents();
                alert("Student deleted successfully!");
            } else {
                students.splice(index, 0, ...deletedStudent);
            }

            resetForm();

        }

    }

    // Clear form
    function resetForm() {

        form.reset();

        editIndex = -1;

        document.getElementById("formTitle").textContent =
            "Add New Student";

        document.getElementById("submitBtn").textContent =
            "Add Student";

    }

    // Update dashboard statistics
    function updateDashboard() {

        document.getElementById("totalStudents").textContent =
            students.length;

        const departments = new Set(
            students.map(student => student.department)
        );

        document.getElementById("totalDepartments").textContent =
            departments.size;

        document.getElementById("maleStudents").textContent =
            students.filter(student =>
                student.gender === "Male"
            ).length;

        document.getElementById("femaleStudents").textContent =
            students.filter(student =>
                student.gender === "Female"
            ).length;

    }

    // Initial display
    displayStudents();

</script>

</body>
</html>
